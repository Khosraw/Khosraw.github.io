<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Additional styling specific to the 404 page */
    .error-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #e0e0e0;
      z-index: 2;
      padding: 20px;
    }
    .error-code {
      font-size: 8em;
      font-weight: 700;
      color: var(--secondary-color);
      margin: 0;
      text-shadow: 0 0 20px rgba(187, 134, 252, 0.7);
      animation: glitchText 2s infinite;
    }
    .error-message, .error-subtext {
      font-size: 1.5em;
      margin: 20px 0;
    }
    .error-subtext a {
      color: var(--primary-color);
      text-decoration: underline;
    }
    #fun-button {
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: var(--primary-color);
      color: #1a1a1a;
      transition: transform 0.3s ease, background-color 0.3s ease;
    }
    #fun-button:hover {
      transform: scale(1.1);
      background-color: var(--secondary-color);
    }
    @keyframes glitchText {
      0% {
        text-shadow: 0 0 20px rgba(187, 134, 252, 0.7);
      }
      50% {
        text-shadow: 0 0 40px rgba(187, 134, 252, 1);
      }
      100% {
        text-shadow: 0 0 20px rgba(187, 134, 252, 0.7);
      }
    }
  </style>
</head>
<body>
  <canvas id="particle-canvas"></canvas>
  <div class="error-wrapper">
    <h1 class="error-code">404</h1>
    <p class="error-message">Oops! We can't seem to find the page you're looking for.</p>
    <p class="error-subtext">Perhaps try going back <a href="index.html">home</a>?</p>
  </div>
  <script>
    // Resize the canvas to always fill the viewport
    function resizeCanvas(){
      const canvas = document.getElementById("particle-canvas");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Enhanced particle explosion effect
    const particles = [];
    
    function Particle(x, y, vx, vy, radius, color) {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.radius = radius;
      this.color = color;
      this.alpha = 1.0;
    }
    
    Particle.prototype.update = function() {
      this.x += this.vx;
      this.y += this.vy;
      this.alpha -= 0.02; // fade rate per frame
    };
    
    Particle.prototype.draw = function(ctx) {
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.fill();
      ctx.restore();
    };
    
    function explosion(x, y) {
      for (let i = 0; i < 40; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;
        const radius = Math.random() * 3 + 2;
        const colors = ["#03dac6", "#bb86fc", "#ff0266"];
        const color = colors[Math.floor(Math.random() * colors.length)];
        particles.push(new Particle(x, y, vx, vy, radius, color));
      }
    }
    
    function animateParticles() {
      const canvas = document.getElementById("particle-canvas");
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.update();
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        } else {
          p.draw(ctx);
        }
      }
      requestAnimationFrame(animateParticles);
    }
    
    // Start the particles animation loop
    animateParticles();
    
    // Trigger explosion on space bar press
    document.addEventListener("keydown", function(e) {
      if (e.code === "Space") {
        const canvas = document.getElementById("particle-canvas");
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        explosion(centerX, centerY);
      }
    });
  </script>
</body>
</html>
