<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Pong Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Game overlay styling matching the 404 theme */
    #game-overlay {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      color: #e0e0e0;
      z-index: 2;
    }
    #game-overlay h1 {
      margin: 10px 0 5px;
      font-size: 2em;
      color: var(--secondary-color);
      text-shadow: 0 0 10px rgba(187, 134, 252, 0.7);
    }
    #game-overlay p {
      margin: 4px 0;
      font-size: 1em;
    }
    /* Style for the Home link */
    #game-overlay a#home-link {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 10px;
      background-color: var(--primary-color);
      color: #1a1a1a;
      text-decoration: none;
      border-radius: 4px;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }
    #game-overlay a#home-link:hover {
      background-color: var(--secondary-color);
      transform: scale(1.05);
    }
    /* Mobile version styling */
    .mobile-content {
      display: none;
      text-align: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 600px;
      padding: 20px;
      background: rgba(26, 26, 26, 0.8);
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }
    
    @media (max-width: 768px) {
      #pong-canvas, #game-overlay {
        display: none;
      }
      .mobile-content {
        display: block;
      }
    }
    /* Score display styling */
    .score-display {
      position: absolute;
      top: 120px;
      width: 100%;
      text-align: center;
      color: var(--primary-color);
      font-size: 64px;
      font-weight: bold;
      text-shadow: 
        0 0 20px rgba(3, 218, 198, 0.5),
        0 0 40px rgba(3, 218, 198, 0.3);
      z-index: 1;
      font-family: 'Inter', sans-serif;
      pointer-events: none;
    }
    .score-display span {
      margin: 0 100px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <canvas id="pong-canvas"></canvas>
  <div class="score-display">
    <span id="player-score">0</span>
    <span id="ai-score">0</span>
  </div>
  <!-- Mobile version -->
  <div class="mobile-content">
    <h1>404</h1>
    <p>Oops! We can't seem to find the page you're looking for.</p>
    <p><a id="home-link" href="/">Go Home</a></p>
  </div>
  <!-- Desktop version with Pong -->
  <div id="game-overlay">
    <h1>Pong 404</h1>
    <p>Page not found. Play Pong to pass the time!</p>
    <p>Use Up/Down arrows to move your paddle. Press Space to serve the ball.</p>
    <p><a id="home-link" href="/">Go Home</a></p>
  </div>
  <script>
    // Setup canvas for the Pong game
    const canvas = document.getElementById('pong-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = Math.min(window.innerWidth, 1200); // Limit court width
    canvas.height = window.innerHeight;
    canvas.style.margin = '0 auto'; // Center the canvas
    canvas.style.display = 'block';

    window.addEventListener('resize', () => {
      canvas.width = Math.min(window.innerWidth, 1200);
      canvas.height = window.innerHeight;
      // Reset positions on resize
      playerPaddle.y = canvas.height / 2 - paddleHeight / 2;
      aiPaddle.y = canvas.height / 2 - paddleHeight / 2;
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
    });

    // Game object settings
    const paddleWidth = 20;
    const paddleHeight = 100;
    const paddleSpeed = 6;
    const ballRadius = 10;

    let playerPaddle = {
      x: 30,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight
    };

    let aiPaddle = {
      x: canvas.width - 30 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight
    };

    let ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: ballRadius,
      vx: 0,
      vy: 0,
      speed: 5
    };

    let serving = true; // true when waiting to serve the ball
    let playerScore = 0;
    let aiScore = 0;
    const playerScoreElement = document.getElementById('player-score');
    const aiScoreElement = document.getElementById('ai-score');

    // Function to update score display
    function updateScoreDisplay() {
      playerScoreElement.textContent = playerScore;
      aiScoreElement.textContent = aiScore;
    }

    // Keyboard input
    let keys = {};
    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      // Serve ball when space is pressed and we're in serving state
      if (e.code === 'Space' && serving) {
        // Start ball moving to the right with a slight random vertical velocity
        ball.vx = ball.speed;
        ball.vy = (Math.random() - 0.5) * 8;
        serving = false;
      }
    });

    document.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // Update game state
    function update() {
      // Move player paddle with Arrow keys
      if (keys['ArrowUp'] && playerPaddle.y > 0) {
        playerPaddle.y -= paddleSpeed;
      }
      if (keys['ArrowDown'] && playerPaddle.y + playerPaddle.height < canvas.height) {
        playerPaddle.y += paddleSpeed;
      }

      // Smarter AI: move towards the ball's y position with prediction and faster speed
      let aiCenter = aiPaddle.y + aiPaddle.height / 2;
      let predictedY = ball.y + (ball.vy * (aiPaddle.x - ball.x) / ball.vx);
      predictedY = Math.max(0, Math.min(canvas.height, predictedY));
      
      if (predictedY < aiCenter - 10) {
        aiPaddle.y -= 4 * (0.9 + Math.random() * 0.3); 
      } else if (predictedY > aiCenter + 10) {
        aiPaddle.y += 4 * (0.9 + Math.random() * 0.3);
      }
      // Constrain AI paddle within canvas
      aiPaddle.y = Math.max(0, Math.min(canvas.height - aiPaddle.height, aiPaddle.y));

      if (!serving) {
        // Move ball continuously
        ball.x += ball.vx;
        ball.y += ball.vy;
      } else {
        // While serving, keep the ball near the player paddle
        ball.x = playerPaddle.x + playerPaddle.width + ball.radius;
        ball.y = playerPaddle.y + playerPaddle.height / 2;
      }

      // Bounce ball off the top and bottom walls
      if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
        ball.vy = -ball.vy;
      }

      // Ball collision with player paddle
      if (
        ball.x - ball.radius < playerPaddle.x + playerPaddle.width &&
        ball.y > playerPaddle.y &&
        ball.y < playerPaddle.y + playerPaddle.height
      ) {
        ball.vx = -ball.vx;
        let hitPos = (ball.y - (playerPaddle.y + playerPaddle.height / 2)) / (playerPaddle.height / 2);
        ball.vy = hitPos * ball.speed * 1.5 + (Math.random() - 0.5) * 2;
      }

      // Ball collision with AI paddle
      if (
        ball.x + ball.radius > aiPaddle.x &&
        ball.y > aiPaddle.y &&
        ball.y < aiPaddle.y + aiPaddle.height
      ) {
        ball.vx = -ball.vx;
        let hitPos = (ball.y - (aiPaddle.y + aiPaddle.height / 2)) / (aiPaddle.height / 2);
        ball.vy = hitPos * ball.speed * 1.5 + (Math.random() - 0.5) * 2;
      }

      // Reset if the ball goes off the left or right side
      if (ball.x < 0 || ball.x > canvas.width) {
        // Update scores
        if (ball.x < 0) {
          aiScore++;
        } else {
          playerScore++;
        }
        updateScoreDisplay();
        
        serving = true;
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;
        ball.vx = 0;
        ball.vy = 0;
        playerPaddle.y = canvas.height / 2 - paddleHeight/2;
        aiPaddle.y = canvas.height / 2 - paddleHeight/2;
      }
    }

    // Draw game objects
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw center line for visual flair
      ctx.setLineDash([5, 15]);
      ctx.beginPath();
      ctx.moveTo(canvas.width/2, 0);
      ctx.lineTo(canvas.width/2, canvas.height);
      ctx.strokeStyle = "#e0e0e0";
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw player paddle
      ctx.fillStyle = "#03dac6";
      ctx.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.width, playerPaddle.height);

      // Draw AI paddle
      ctx.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.width, aiPaddle.height);

      // Draw ball
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#bb86fc";
      ctx.fill();
    }

    // Main game loop
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
